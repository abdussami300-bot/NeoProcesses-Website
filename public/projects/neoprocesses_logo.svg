
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C18" />
      <stop offset="50%" stop-color="#09182E" />
      <stop offset="100%" stop-color="#02060E" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neoGradientDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#0EA5E9" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Center Ambient Tech Glow -->
  <circle cx="512" cy="512" r="450" fill="url(#glow)" />

  <!-- Mathematical Perfect Center Alignment (tx=22, ty=102, scale=3.8) -->
  <g transform="translate(22, 102) scale(3.8)" filter="url(#subtleShadow)">
    <!-- White vertical stem of N -->
    <path d="M 45 155 V 45 H 63 V 155 Z" fill="#FFFFFF" />
    <!-- Radiant Cyan-Blue continuous loop -->
    <path d="M 52 48 L 118 135 C 132 153 158 153 172 138 C 185 124 185 101 172 87 C 158 72 133 72 118 89 L 105 104 L 92 88 L 108 70 C 131 46 168 46 191 68 C 213 89 213 125 191 148 C 168 171 130 170 106 142 L 52 70 V 48 Z" 
          fill="url(#neoGradientDark)" />
  </g>
</svg>
